<div class="d-flex" id="wrapper">
    <!-- Sidebar -->
    <div class="glass-panel border-end" id="sidebar-wrapper" [class.toggled]="isToggled">
        <div class="sidebar-heading text-white border-bottom border-secondary py-4 text-center">
            <div class="fs-4 fw-bold gradient-text">ANTIGRAVITY</div>
            <small class="text-muted text-uppercase letter-spacing-2">ERP Arts Alu</small>
        </div>

        <div class="list-group list-group-flush my-3">
            <!-- 1. Dashboard -->
            <a routerLink="/dashboard" routerLinkActive="active" class="list-group-item list-group-item-action p-3">
                <i class="bi bi-speedometer2 me-3"></i> Dashboard
            </a>

            <!-- 2. Affaires -->
            <a routerLink="/affaires" routerLinkActive="active" class="list-group-item list-group-item-action p-3">
                <i class="bi bi-briefcase me-3"></i> Affaires
            </a>

            <!-- 3. Commandes -->
            <a routerLink="/commandes" routerLinkActive="active" class="list-group-item list-group-item-action p-3">
                <i class="bi bi-cart3 me-3"></i> Commandes
            </a>

            <!-- 4. Calculs -->
            <a routerLink="/besoin" routerLinkActive="active" class="list-group-item list-group-item-action p-3">
                <i class="bi bi-calculator me-3"></i> Calculs (M2)
            </a>

            <!-- 5. Bibliothèque -->
            <a routerLink="/bibliotheque" routerLinkActive="active" class="list-group-item list-group-item-action p-3">
                <i class="bi bi-box-seam me-3"></i> Bibliothèque
            </a>

            <!-- 6. Tiers -->
            <a routerLink="/tiers" routerLinkActive="active" class="list-group-item list-group-item-action p-3">
                <i class="bi bi-people me-3"></i> Clients & Fourn.
            </a>
        </div>

        <div class="mt-auto p-3">
            <div class="user-card glass-panel p-2 d-flex align-items-center rounded">
                <div class="avatar bg-primary text-white rounded-circle me-2 d-flex align-items-center justify-content-center"
                    style="width: 32px; height: 32px;">U</div>
                <div>
                    <div class="small fw-bold">User</div>
                    <div class="extra-small text-muted">Admin</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Page Content -->
    <div id="page-content-wrapper" class="w-100">
        <nav class="navbar navbar-expand-lg navbar-dark bg-transparent border-bottom border-secondary p-3">
            <div class="container-fluid">
                <button class="btn btn-icon text-white" (click)="toggleSidebar()">
                    <i class="bi bi-list fs-4"></i>
                </button>

                <div class="ms-auto d-flex align-items-center">
                    <button class="btn btn-icon text-white me-3 position-relative">
                        <i class="bi bi-bell"></i>
                        <span
                            class="position-absolute top-0 start-100 translate-middle p-1 bg-danger border border-light rounded-circle">
                            <span class="visually-hidden">New alerts</span>
                        </span>
                    </button>
                </div>
            </div>
        </nav>

        <div class="container-fluid p-4 main-content">
            <router-outlet></router-outlet>
        </div>
    </div>
</div>
